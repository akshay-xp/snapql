name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter extension exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # Browsers only: the runner image ships Google Chrome, so the system
      # libraries --with-deps would apt-install are already present.
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter extension exec playwright install chromium
      - name: Check Chromium libraries
        run: |
          missing=$(ldd ~/.cache/ms-playwright/chromium-*/chrome-linux64/chrome ~/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell | grep "not found" | sort -u)
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
          echo "All Chromium libraries present"
      - name: E2E
        run: pnpm e2e

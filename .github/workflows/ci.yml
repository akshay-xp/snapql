name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter extension exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # Browsers only: the runner image ships Google Chrome, so the system
      # libraries --with-deps would apt-install are already present.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter extension exec playwright install chromium
      - name: Check Chromium libraries
        run: |
          missing=$(ldd ~/.cache/ms-playwright/chromium-*/chrome-linux64/chrome ~/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell | grep "not found" | sort -u)
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
          echo "All Chromium libraries present"
      - name: E2E
        run: pnpm e2e

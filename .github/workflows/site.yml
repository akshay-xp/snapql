name: Site

on:
  push:
    branches: [master]
    paths:
      - apps/site/**
      # The site shows the extension's captures and version.
      - apps/extension/store/captures/**
      - apps/extension/package.json
      - pnpm-lock.yaml
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

# One deploy per branch at a time; a newer push supersedes an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests don't need this job: CI's root build and e2e already build
  # and test the site.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter site build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: apps/site/dist/

  # Deploys exactly what the build job produced rather than rebuilding, so what
  # goes live is the artifact that was built. Only from master.
  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      # No checkout on purpose: only the artifact is needed, and a checked-out
      # pnpm-lock.yaml would make wrangler-action infer pnpm, which this job
      # doesn't set up.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: apps/site/dist/
      - uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4.1.2
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Stated rather than inferred from a lockfile.
          packageManager: npm
          # Pinned like the action SHAs: this step holds a token that can
          # publish the site, so it must not float.
          wranglerVersion: "4.151.0"
          command: pages deploy apps/site/dist --project-name=snapql --branch=master

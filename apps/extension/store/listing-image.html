<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SnapQL listing image</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  .card {
    position: relative;
    width: 1280px;
    height: 800px;
    overflow: hidden;
    background-color: #dcdbd9;
    background-image:
      linear-gradient(#cbcac7 1px, transparent 1px),
      linear-gradient(90deg, #cbcac7 1px, transparent 1px),
      linear-gradient(#d4d3d0 1px, transparent 1px),
      linear-gradient(90deg, #d4d3d0 1px, transparent 1px);
    background-size: 80px 80px, 80px 80px, 20px 20px, 20px 20px;
  }
  .top {
    position: absolute;
    left: 80px;
    right: 200px;
    top: 36px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font: 500 13px/1 "IBM Plex Mono", monospace;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #262626;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  h1 {
    position: absolute;
    left: 80px;
    top: 96px;
    margin: 0;
    font: 600 60px/1.04 "IBM Plex Sans", sans-serif;
    letter-spacing: -0.025em;
    color: #262626;
  }
  p {
    position: absolute;
    left: 80px;
    top: 176px;
    width: 900px;
    margin: 0;
    font: 400 23px/1.4 "IBM Plex Sans", sans-serif;
    color: #4d4d4b;
  }
  .trace { position: absolute; left: 0; top: 0; }
  .shot {
    position: absolute;
    left: 80px;
    top: 290px;
    width: 1200px;
    height: 510px;
    background-repeat: no-repeat;
    box-shadow: 0 0 0 1px #262626;
  }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <span class="brand">
      <svg width="28" height="28" viewBox="16 16 96 96" aria-hidden="true">
        <rect x="16" y="16" width="96" height="96" fill="#262626"></rect>
        <path d="M38.93 40.59L19.76 59.76A6 6 0 0 0 19.76 68.24L38.93 87.41A2 2 0 0 0 40.34 88L51.66 88A2 2 0 0 0 53.07 84.59L33.55 65.06A1.5 1.5 0 0 1 33.55 62.94L53.07 43.41A2 2 0 0 0 51.66 40L40.34 40A2 2 0 0 0 38.93 40.59Z" fill="#dcdbd9"></path>
        <path d="M89.07 40.59L108.24 59.76A6 6 0 0 1 108.24 68.24L89.07 87.41A2 2 0 0 1 87.66 88L76.34 88A2 2 0 0 1 74.93 84.59L94.45 65.06A1.5 1.5 0 0 0 94.45 62.94L74.93 43.41A2 2 0 0 1 76.34 40L87.66 40A2 2 0 0 1 89.07 40.59Z" fill="#dcdbd9"></path>
        <path d="M70 4L70 54.76A3 3 0 0 1 69.12 56.88L58.88 67.12A3 3 0 0 0 58 69.24L58 124" fill="none" stroke="#ff4419" stroke-width="5"></path>
      </svg>
      SnapQL
    </span>
    <span id="index"></span>
  </div>
  <h1 id="headline">SnapQL</h1>
  <p id="subline"></p>
  <svg class="trace" width="1280" height="291" aria-hidden="true">
    <path d="M1120 0V196L1090 226V291" fill="none" stroke="#ff4419" stroke-width="3" stroke-linejoin="round"></path>
  </svg>
  <div class="shot" id="shot"></div>
</div>
<script>
  // Filled by store/listing-images.ts through the query string. Captures are
  // already at 1.25x: drawn at their own size on whole pixels, never resampled.
  const q = new URLSearchParams(location.search)
  const scale = 1.25
  document.getElementById("index").textContent = q.get("index")
  document.getElementById("headline").textContent = q.get("headline")
  document.getElementById("subline").textContent = q.get("subline")
  const shot = document.getElementById("shot")
  shot.style.backgroundImage = `url(captures/${q.get("capture")}.png)`
  shot.style.backgroundPosition = `${-q.get("x") * scale}px ${-q.get("y") * scale}px`
</script>
</body>
</html>

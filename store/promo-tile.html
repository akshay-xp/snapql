<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SnapQL promo tile</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  .tile {
    position: relative;
    overflow: hidden;
    background-color: #dcdbd9;
    background-image:
      linear-gradient(#cbcac7 1px, transparent 1px),
      linear-gradient(90deg, #cbcac7 1px, transparent 1px),
      linear-gradient(#d4d3d0 1px, transparent 1px),
      linear-gradient(90deg, #d4d3d0 1px, transparent 1px);
    background-size: 80px 80px, 80px 80px, 20px 20px, 20px 20px;
    color: #262626;
  }
  .mark { position: absolute; left: 0; top: 0; }
  .text { position: absolute; }
  .name { margin: 0; font: 600 1px/1 "IBM Plex Sans", sans-serif; letter-spacing: -0.03em; }
  .line { margin: 0; font: 400 1px/1.3 "IBM Plex Sans", sans-serif; color: #4d4d4b; text-wrap: balance; }
  .protocols {
    margin: 0;
    font: 500 14px/1 "IBM Plex Mono", monospace;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .small { width: 440px; height: 280px; background-size: 40px 40px, 40px 40px, 10px 10px, 10px 10px; }
  .small .text { left: 236px; top: 94px; width: 180px; }
  .small .name { font-size: 46px; }
  .small .line { margin-top: 12px; font-size: 17px; }
  .small .protocols, .small .full, .marquee .short { display: none; }

  .marquee { width: 1400px; height: 560px; }
  .marquee .text { left: 96px; top: 150px; width: 700px; }
  .marquee .name { font-size: 104px; }
  .marquee .line { margin-top: 20px; font-size: 34px; }
  .marquee .protocols { margin-top: 48px; }
</style>
</head>
<body>
<div class="tile" id="tile">
  <svg class="mark" id="mark" aria-hidden="true">
    <g id="art">
      <path d="M38.93 40.59L19.76 59.76A6 6 0 0 0 19.76 68.24L38.93 87.41A2 2 0 0 0 40.34 88L51.66 88A2 2 0 0 0 53.07 84.59L33.55 65.06A1.5 1.5 0 0 1 33.55 62.94L53.07 43.41A2 2 0 0 0 51.66 40L40.34 40A2 2 0 0 0 38.93 40.59Z" fill="#262626"></path>
      <path d="M43.33 39.86L21.6 61.6A3.4 3.4 0 0 0 21.6 66.4L43.33 88.14" fill="none" stroke="#dcdbd9" stroke-width="1"></path>
      <path d="M89.07 40.59L108.24 59.76A6 6 0 0 1 108.24 68.24L89.07 87.41A2 2 0 0 1 87.66 88L76.34 88A2 2 0 0 1 74.93 84.59L94.45 65.06A1.5 1.5 0 0 0 94.45 62.94L74.93 43.41A2 2 0 0 1 76.34 40L87.66 40A2 2 0 0 1 89.07 40.59Z" fill="#262626"></path>
      <path d="M84.67 39.86L106.4 61.6A3.4 3.4 0 0 1 106.4 66.4L84.67 88.14" fill="none" stroke="#dcdbd9" stroke-width="1"></path>
      <!-- The icon's slash, run past the tile's edges. -->
      <path d="M70 -200L70 54.76A3 3 0 0 1 69.12 56.88L58.88 67.12A3 3 0 0 0 58 69.24L58 300" fill="none" stroke="#ff4419" stroke-width="3.2"></path>
    </g>
  </svg>
  <div class="text">
    <h1 class="name">SnapQL</h1>
    <p class="line full">Network traffic in DevTools, made readable.</p>
    <p class="line short">Network traffic, made readable.</p>
    <p class="protocols">GraphQL · REST · gRPC-web · WebSocket · SSE · LLM streams</p>
  </div>
</div>
<script>
  // Filled by store/listing-images.ts: ?kind=small|marquee. The mark is the
  // icon's art (viewBox 16..112) at `scale`, its bracket centre at `cx, cy`.
  const layouts = {
    small: { width: 440, height: 280, scale: 2, cx: 120, cy: 140 },
    marquee: { width: 1400, height: 560, scale: 4.2, cx: 1076, cy: 280 },
  }
  const kind = new URLSearchParams(location.search).get("kind")
  const { width, height, scale, cx, cy } = layouts[kind]
  document.getElementById("tile").classList.add(kind)
  const mark = document.getElementById("mark")
  mark.setAttribute("width", width)
  mark.setAttribute("height", height)
  document
    .getElementById("art")
    .setAttribute("transform", `translate(${cx - 64 * scale} ${cy - 64 * scale}) scale(${scale})`)
</script>
</body>
</html>
